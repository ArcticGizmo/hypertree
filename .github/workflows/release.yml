name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

# Tag-triggered Velopack release. hypertree is Windows-only, so one job builds, packs, and
# publishes the GitHub Release. Mirrors ../sprig's release pipeline.
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Install vpk CLI
        run: dotnet tool install -g vpk

      - name: Get version from tag
        id: version
        run: echo "VERSION=$($env:GITHUB_REF_NAME -replace '^v','')" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: |
          dotnet publish src/Hypertree.App/Hypertree.App.csproj -c Release -r win-x64 --self-contained true `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -o publish/

      # htree ships INTO the same folder, so it lands beside hypertree.exe in the installed
      # `current\` directory - which is what lets the tray advertise its absolute path in status.json
      # and saves every reader from guessing at the install layout.
      #
      # Native AOT needs the MSVC linker; windows-latest carries the Desktop C++ workload, so this
      # works in CI. Publishing it locally needs that workload installed too (a plain `dotnet build`
      # does not). AOT is worth the constraint: `htree status` is meant to sit in a shell prompt, and
      # a JIT build measures ~87ms per invocation against single digits AOT-compiled.
      - name: Publish htree CLI
        run: |
          dotnet publish src/Hypertree.Cli/Hypertree.Cli.csproj -c Release -r win-x64 `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -o publish/

      - name: Pack with Velopack
        run: >
          vpk pack
          --packId Hypertree
          --packTitle "Hypertree"
          --packVersion ${{ steps.version.outputs.VERSION }}
          --packDir publish/
          --mainExe hypertree.exe
          --icon src/Hypertree.App/Assets/icon.ico
          --outputDir releases/

      # SHA256SUMS.txt is what install.ps1 verifies Hypertree-win-Setup.exe against before running it, so
      # it has to describe exactly the bytes that get uploaded - which is why it is generated here, after
      # the pack, rather than anywhere the contents of releases/ could still change.
      - name: Generate SHA256SUMS.txt
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Resolve-Path releases

          # install.ps1 resolves this asset by name from the release metadata; a release without it can't be
          # installed by the one-liner, so fail here rather than publishing a broken install path.
          if (-not (Test-Path -LiteralPath (Join-Path $dir 'Hypertree-win-Setup.exe'))) {
            Write-Host '::error::Hypertree-win-Setup.exe is missing - install.ps1 depends on it.'
            exit 1
          }

          # Skipping the manifest keeps a stale one out of the new one: a fresh runner never has one, but a
          # re-run with a restored releases/ would otherwise list SHA256SUMS.txt's own previous bytes.
          # Filtered with Where-Object, NOT -Exclude: Get-ChildItem silently IGNORES -Exclude when it is
          # paired with -LiteralPath, so that spelling looks right and quietly does nothing.
          $lines = Get-ChildItem -File -LiteralPath $dir |
            Where-Object Name -ne 'SHA256SUMS.txt' | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }

          # Written outside releases/ and moved in, so the manifest can never hash itself. LF-terminated
          # lower-case hex in sha256sum's own format, so `sha256sum -c SHA256SUMS.txt` validates it as-is.
          # -Force because a bare Move-Item onto an existing destination fails WITHOUT failing the step,
          # which would publish new binaries beside the previous run's stale manifest.
          $manifest = Join-Path $dir 'SHA256SUMS.txt'
          $tmp = Join-Path $env:RUNNER_TEMP 'SHA256SUMS.txt'
          [System.IO.File]::WriteAllText($tmp, ($lines -join "`n") + "`n")
          Move-Item -LiteralPath $tmp -Destination $manifest -Force

          # The whole point of the manifest is that it describes the bytes being uploaded, so prove it here
          # rather than leaving install.ps1's users to discover otherwise. This is the same comparison
          # install.ps1 makes, run before anything is published.
          $setup = Join-Path $dir 'Hypertree-win-Setup.exe'
          $want = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not ((Get-Content -LiteralPath $manifest) -contains "$want  Hypertree-win-Setup.exe")) {
            Write-Host "::error::SHA256SUMS.txt does not match Hypertree-win-Setup.exe ($want) - refusing to publish."
            exit 1
          }
          Write-Host "Verified SHA256SUMS.txt describes Hypertree-win-Setup.exe ($want)"

          '### Published assets' | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```'                  | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          Get-Content -LiteralPath $manifest | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          '```'                  | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: releases/*
          generate_release_notes: true
